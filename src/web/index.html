<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="ev-session" content="__EV_SESSION__" />
    <title>Miru</title>
    <link rel="icon" type="image/svg+xml" href="/miru.svg" />
  </head>
  <body>
    <a class="skip-link" href="#content">プレビューへ移動</a>
    <header>
      <span class="brand"> <img src="/miru.svg" alt="" width="24" height="24" /> Miru </span>
      <form id="search-form" role="search" aria-label="HOME内のファイルとフォルダを検索">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="4.75" />
          <path d="m12 12 4.25 4.25" />
        </svg>
        <input
          id="query"
          type="search"
          autocomplete="off"
          maxlength="256"
          placeholder="ファイルを検索"
          aria-label="HOMEを検索"
          aria-description="ファイル名やパスを2文字以上入力すると検索します。"
          aria-controls="results"
        />
        <div id="results" hidden></div>
      </form>
    </header>
    <main>
      <aside id="explorer" aria-label="フォルダとGit状態">
        <div class="folder-heading">
          <button id="parent" type="button" title="親を一段表示" aria-label="親を一段表示" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 18V6m-5 5 5-5 5 5" />
            </svg>
          </button>
          <div>
            <strong
              id="folder-name"
              tabindex="0"
              aria-haspopup="menu"
              aria-description="Shift+F10でフォルダの操作メニューを開きます。"
              >ファイルをすぐに確認。</strong
            ><small id="location">フォルダを指定するか、HOMEを検索してください。</small>
          </div>
          <div class="folder-actions">
            <button
              id="tree-filter-toggle"
              type="button"
              title="絞り込み"
              aria-label="絞り込み"
              aria-controls="tree-filters"
              aria-expanded="false"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M7 12h10m-7 5h4" />
              </svg>
            </button>
            <div
              id="tree-filters"
              class="navigation-popover"
              role="group"
              aria-label="ファイルツリーの絞り込み"
              hidden
            >
              <input
                id="tree-query"
                type="search"
                placeholder="このフォルダ内を絞り込み"
                aria-label="このフォルダ内を絞り込み"
                aria-controls="tree"
                autocomplete="off"
                maxlength="256"
              />
              <label class="navigation-item"
                ><input id="exclude-git" type="checkbox" aria-controls="tree" checked />.git
                を除外</label
              >
              <label class="navigation-item"
                ><input
                  id="exclude-ignored"
                  type="checkbox"
                  aria-controls="tree"
                  disabled
                />無視ファイルを除外</label
              >
              <label class="navigation-item"
                ><input
                  id="changed-only"
                  type="checkbox"
                  aria-controls="tree"
                  disabled
                />変更ファイルのみ</label
              >
            </div>
          </div>
        </div>
        <nav id="tree" aria-label="ファイルツリー"></nav>
      </aside>
      <div
        id="explorer-resize"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="サイドナビの幅"
        aria-controls="explorer"
      ></div>
      <section class="viewer" aria-label="ファイルビューアー">
        <div id="file-pane" class="viewer-pane">
          <div class="viewer-bar file-bar" id="file-bar" hidden>
            <strong class="viewer-title" id="file-name"></strong>
            <div class="modes" id="file-modes" role="group" aria-label="ファイルの表示方式">
              <button data-mode="preview" disabled>プレビュー</button
              ><button data-mode="code" disabled>コード</button
              ><button data-mode="diff" disabled>差分</button>
            </div>
          </div>
          <div id="diff-options" hidden>
            <label
              >比較対象
              <select id="stage">
                <option value="unstaged">未ステージ · index → 作業ツリー</option>
                <option value="staged">ステージ済み · HEAD → index</option>
              </select></label
            >
          </div>
          <div id="content" tabindex="0" role="region" aria-label="ファイルの内容"></div>
          <button id="external" hidden>
            HTMLを外部ブラウザで開く（スクリプトが動く場合があります）
          </button>
        </div>
        <section id="settings-panel" class="viewer-pane" aria-labelledby="settings-title" hidden>
          <div class="viewer-bar">
            <h1 class="viewer-title" id="settings-title" tabindex="-1">設定</h1>
            <button id="settings-close" title="閉じる" aria-label="設定を閉じる" type="button">
              ×
            </button>
          </div>
          <div class="settings-content">
            <fieldset id="theme">
              <legend>テーマ</legend>
              <label><input type="radio" name="theme" value="light" /> ライト</label>
              <label><input type="radio" name="theme" value="dark" /> ダーク</label>
            </fieldset>
            <p id="theme-message" role="status"></p>
          </div>
        </section>
      </section>
    </main>
    <footer>
      <div id="settings">
        <button
          id="settings-toggle"
          type="button"
          aria-label="設定"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9.88 5.85 L10.49 3.43 13.51 3.43 14.12 5.85 A6.5 6.5 0 0 1 16.26 7.09 L18.66 6.41 20.18 9.02 18.38 10.76 A6.5 6.5 0 0 1 18.38 13.24 L20.18 14.98 18.66 17.59 16.26 16.91 A6.5 6.5 0 0 1 14.12 18.15 L13.51 20.57 10.49 20.57 9.88 18.15 A6.5 6.5 0 0 1 7.74 16.91 L5.34 17.59 3.82 14.98 5.62 13.24 A6.5 6.5 0 0 1 5.62 10.76 L3.82 9.02 5.34 6.41 7.74 7.09 A6.5 6.5 0 0 1 9.88 5.85 Z"
            />
            <circle cx="12" cy="12" r="2.6" />
          </svg>
        </button>
      </div>
      <div id="status" role="status"></div>
      <small id="version-value" title="Miru のバージョン"></small>
    </footer>
    <div
      id="context-menu"
      class="navigation-popover"
      role="menu"
      aria-label="項目の操作"
      hidden
    ></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
