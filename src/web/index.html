<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="ev-session" content="__EV_SESSION__" />
    <title>Miru</title>
    <link rel="icon" type="image/svg+xml" href="/miru.svg" />
  </head>
  <body>
    <a class="skip-link" href="#content">プレビューへ移動</a>
    <header>
      <span class="brand"> <img src="/miru.svg" alt="" width="24" height="24" /> Miru </span>
      <form id="search-form" role="search" aria-label="HOME内のファイルとフォルダを検索">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="4.75" />
          <path d="m12 12 4.25 4.25" />
        </svg>
        <input
          id="query"
          type="search"
          autocomplete="off"
          maxlength="256"
          placeholder="ファイルを検索"
          aria-label="HOMEを検索"
          aria-description="ファイル名やパスを2文字以上入力すると検索します。"
          aria-controls="results"
        />
        <div id="results" hidden></div>
      </form>
      <div id="settings">
        <button
          id="settings-toggle"
          type="button"
          aria-label="設定"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10 3h4l.5 2.6 1.8.8 2.25-1.5 2.55 2.55-1.5 2.25.8 1.8L23 12l-.5 3-2.64.46-.8 1.66 1.34 2.14-2.55 2.55-2.2-1.42-1.7.69L13.5 23h-3l-.51-2.58-1.69-.7-2.18 1.42-2.55-2.55 1.42-2.18-.7-1.69L2 14.2v-3.6l2.6-.48.7-1.68L4 6.3l2.55-2.55 2.2 1.43 1.25-.63Z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <div id="settings-panel" aria-label="設定" role="group" hidden>
          <button id="theme" type="button">ダークに切り替え</button>
          <p id="version">バージョン <span id="version-value"></span></p>
        </div>
      </div>
    </header>
    <main>
      <aside id="explorer" aria-label="フォルダとGit状態">
        <div class="folder-heading">
          <button id="parent" type="button" title="親を一段表示" aria-label="親を一段表示" disabled>
            ↑
          </button>
          <div>
            <strong
              id="folder-name"
              tabindex="0"
              aria-haspopup="menu"
              aria-description="Shift+F10で親フォルダへの操作メニューを開きます。"
              >ファイルをすぐに確認。</strong
            ><small id="location">フォルダを指定するか、HOMEを検索してください。</small>
          </div>
          <button id="refresh" type="button" title="フォルダを更新" aria-label="フォルダを更新">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 7v5h-5m5 0a8 8 0 1 0-1.7 5" />
            </svg>
          </button>
        </div>
        <div class="tree-filters" role="group" aria-label="ファイルツリーの絞り込み">
          <label
            ><input
              id="exclude-ignored"
              type="checkbox"
              aria-controls="tree"
              disabled
            />無視ファイルを除外</label
          >
          <label
            ><input
              id="changed-only"
              type="checkbox"
              aria-controls="tree"
              disabled
            />変更ファイルのみ</label
          >
        </div>
        <nav id="tree" aria-label="ファイルツリー"></nav>
      </aside>
      <div
        id="explorer-resize"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="サイドナビの幅"
        aria-controls="explorer"
      ></div>
      <section class="viewer" aria-label="ファイルビューアー">
        <div class="file-bar" id="file-bar" hidden>
          <strong id="file-name"></strong>
          <div class="modes" id="file-modes" role="group" aria-label="ファイルの表示方式">
            <button data-mode="preview" disabled>プレビュー</button
            ><button data-mode="code" disabled>コード</button
            ><button data-mode="diff" disabled>差分</button>
          </div>
        </div>
        <div id="diff-options" hidden>
          <label
            >比較対象
            <select id="stage">
              <option value="unstaged">未ステージ · index → 作業ツリー</option>
              <option value="staged">ステージ済み · HEAD → index</option>
            </select></label
          >
        </div>
        <div id="content" tabindex="0" role="region" aria-label="ファイルの内容"></div>
        <button id="external" hidden>
          HTMLを外部ブラウザで開く（スクリプトが動く場合があります）
        </button>
      </section>
    </main>
    <div id="status" role="status"></div>
    <div id="context-menu" role="menu" aria-label="項目の操作" hidden></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
